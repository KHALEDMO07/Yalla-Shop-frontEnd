<div class="min-h-screen bg-slate-100 text-slate-900">
  <div class="flex min-h-screen">

    <app-admin-sidebar class="shrink-0" [isOpen]="isSidebarOpen" [navigationItems]="navigationItems"
      [displayName]="displayName" [displayEmail]="displayEmail" (close)="closeSidebar()"></app-admin-sidebar>

    <div class="flex flex-1 flex-col">
      <div class="fixed right-4 top-4 z-[60] flex w-[340px] max-w-[calc(100vw-2rem)] flex-col gap-2">
        <div *ngFor="let message of toastService.messages"
          class="flex items-start justify-between gap-3 rounded-xl px-4 py-3 text-sm shadow-lg"
          [ngClass]="message.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'">
          <p>{{ message.text }}</p>
          <button type="button" class="text-white/90 hover:text-white"
            (click)="toastService.remove(message.id)">x</button>
        </div>
      </div>

      <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
        <div class="flex items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
          <div class="flex items-center gap-3">
            <button type="button"
              class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 text-slate-700 transition hover:border-slate-300 hover:bg-slate-50 md:hidden"
              (click)="toggleSidebar()">
              <span class="material-symbols-outlined">menu</span>
            </button>

            <div>
              <p class="text-xs uppercase tracking-[0.22em] text-slate-500">Admin Area</p>
              <h1 class="font-headline text-2xl font-extrabold tracking-tight text-slate-950">Dashboard Workspace</h1>
            </div>
          </div>

          <div class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2">
            <div class="hidden text-right sm:block">
              <p class="text-sm font-semibold text-slate-900">{{ displayName }}</p>
              <p class="text-xs text-slate-500">{{ displayRole }}</p>
            </div>

            <div
              class="flex h-11 w-11 items-center justify-center rounded-2xl bg-slate-950 text-sm font-semibold text-white">
              {{ initials }}
            </div>

            <button type="button"
              class="inline-flex items-center gap-2 rounded-2xl bg-rose-50 px-3 py-2 text-sm font-medium text-rose-700 transition hover:bg-rose-100"
              (click)="logout()">
              <span class="material-symbols-outlined text-[18px]">logout</span>
              <span class="hidden sm:inline">Logout</span>
            </button>
          </div>
        </div>
      </header>

      <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
