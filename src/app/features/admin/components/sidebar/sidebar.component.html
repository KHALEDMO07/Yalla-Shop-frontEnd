<div *ngIf="isOpen" 
     class="fixed inset-0 z-30 bg-slate-900/60 backdrop-blur-sm transition-opacity md:hidden" 
     aria-hidden="true"
     (click)="onClose()">
</div>

<aside class="fixed left-0 top-0 z-40 flex h-screen w-72 flex-col border-r border-slate-800 bg-slate-950 text-slate-100 shadow-2xl transition-transform duration-300 ease-in-out md:sticky md:top-0 md:translate-x-0" 
       [class.translate-x-0]="isOpen" 
       [class.-translate-x-full]="!isOpen"
       aria-label="Admin Navigation">
       
  <div class="shrink-0 border-b border-slate-800/60 px-6 py-6">
    <span class="text-2xl font-black tracking-tight text-white">Yalla Admin</span>
    <p class="mt-1.5 text-xs font-medium leading-relaxed text-slate-400">
      Marketplace control center for admins only.
    </p>
  </div>

  <nav class="flex-1 space-y-1.5 overflow-y-auto px-4 py-6 [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
    <a *ngFor="let item of navigationItems; trackBy: trackByRoute" 
       [routerLink]="item.route"
       routerLinkActive="!bg-gradient-to-br !from-slate-900 !to-slate-800 !text-white shadow-[inset_0_0_0_1px_rgba(148,163,184,0.15)]" 
       [routerLinkActiveOptions]="{ exact: true }"
       class="group flex items-start gap-3 rounded-2xl px-4 py-3.5 text-slate-300 transition-all duration-200 hover:translate-x-1 hover:bg-slate-900 hover:text-white focus:outline-none focus:ring-2 focus:ring-slate-700" 
       (click)="onClose()">
       
      <span class="material-symbols-outlined mt-0.5 shrink-0 text-[22px] transition-colors group-hover:text-white" aria-hidden="true">
        {{ item.icon }}
      </span>

      <span class="flex flex-1 flex-col">
        <span class="text-sm font-semibold tracking-wide">{{ item.label }}</span>
        <span class="mt-0.5 text-xs font-medium text-slate-500 transition-colors group-hover:text-slate-400">
          {{ item.helperText }}
        </span>
      </span>
    </a>
  </nav>

  <div class="shrink-0 border-t border-slate-800/60 p-4">
    <div class="rounded-2xl bg-slate-900/50 p-4 ring-1 ring-white/5 transition-colors hover:bg-slate-900">
      <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Signed in as</p>
      <p class="mt-1.5 truncate text-sm font-bold text-white" [title]="displayName">
        {{ displayName }}
      </p>
      <p class="truncate text-xs font-medium text-slate-400" [title]="displayEmail">
        {{ displayEmail }}
      </p>
    </div>
  </div>

</aside>
