

<header class="fixed top-0 inset-x-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200/70">
  <nav class="max-w-7xl mx-auto h-20 px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
    <a routerLink="/home" class="text-lg sm:text-xl font-semibold tracking-tight text-slate-900">
      Yalla<span class="text-primary">Shop</span>
    </a>
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Add ID "cartIcon" to act as target for animation service -->
      <!-- Add animate-bounce class conditionally -->
      <a routerLink="/cart" id="cartIcon" class="icon-button relative" aria-label="Cart"
        [ngClass]="{'animate-bounce': isBouncing}">
        <span *ngIf="isLoggedIn" class="material-symbols-outlined text-[20px]">shopping_cart</span>
        <span *ngIf="(cartCount$ | async) as count"
          class="absolute -top-1 -right-1 bg-primary text-on-primary text-[10px] font-bold px-[5px] py-[1px] rounded-full">
          {{ count }}
        </span>
      </a>
      <a *ngIf="isCustomer" routerLink="/orders" class="icon-button" aria-label="My Orders" title="My Orders">
        <span class="material-symbols-outlined text-[20px]">receipt_long</span>
      </a>
      <button *ngIf="isCustomer" class="relative group p-2 hover:bg-slate-50 rounded-full transition-colors"
        routerLink="/wishlist" aria-label="Wishlist" title="Wishlist">
        <span *ngIf="isLoggedIn" class="material-symbols-outlined text-on-surface">favorite</span>
      </button>
      <ng-container *ngIf="isLoggedIn; else loggedOut">
        <!-- <a [routerLink]="dashboardRoute" *ngIf="isSeller||isAdmin" class="hidden sm:inline-flex nav-pill">Dashboard</a> -->
        <a routerLink="/profile" class="user-pill">
          <span class="avatar">{{ userName.charAt(0) | uppercase }}</span>
          <span class="hidden lg:inline truncate max-w-[110px]">{{ userName }}</span>
        </a>
        <button class="icon-button text-red-600 hover:bg-red-50" (click)="logout()" title="Logout" type="button">
          <span class="material-symbols-outlined text-[20px]">logout</span>
        </button>
      </ng-container>

      <ng-template #loggedOut>
        <a routerLink="/auth/login" class="nav-link">Login</a>
        <a routerLink="/auth/register" class="nav-pill">Register</a>
      </ng-template>
    </div>
  </nav>
</header>
